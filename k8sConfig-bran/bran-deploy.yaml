apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: bran
  name: bran
  namespace: fampay-dev
spec:
  progressDeadlineSeconds: 600
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: bran
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: bran
    spec:
      containers:
      - env:
        - name: HTTP_PROXY
          value: http://squid-proxy.fampay-dev.svc.cluster.local:3128
        - name: HTTPS_PROXY
          value: http://squid-proxy.fampay-dev.svc.cluster.local:3128
        envFrom:
        - secretRef:
            name: bran-secrets
        - configMapRef:
            name: bran-config
        image: localhost/bran-app:latest
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /bran/
            port: 8000
            scheme: HTTP
          initialDelaySeconds: 40
          periodSeconds: 20
          successThreshold: 1
          timeoutSeconds: 5
        name: bran
        ports:
        - containerPort: 8000
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /bran/
            port: 8000
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 15
          successThreshold: 1
          timeoutSeconds: 4
        resources:
          limits:
            cpu: 200m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 256Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
